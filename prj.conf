# GPIO: heartbeat (PC11) and brake light (PC10)
CONFIG_GPIO=y

# ADC1 (brake pressure, suspension, NTC) and CAN1/CAN2 drivers
CONFIG_ADC=y
CONFIG_CAN=y
# Error counters per type (stuff, form, ACK, bit, CRC) for can_bus_service()
CONFIG_STATS=y
CONFIG_CAN_STATS=y

# IWDG (watchdog0)
CONFIG_WATCHDOG=y
# sys_reboot(), used if a module fails to start and the IWDG isn't running
CONFIG_REBOOT=y

# Logging over the console (USART1, 115200 8N1)
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Log also over SWD (SEGGER RTT): readable with only the ST-LINK plugged in (west rtt).
# The UART log stays on. DROP: with no debugger reading, full-buffer messages are
# dropped instead of stalling the log thread (on the car nothing reads RTT).
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_RTT_MODE_DROP=y
# 4 KB up-buffer: ~2 s of the 100 ms sensor log, so OpenOCD's polling never loses lines
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Longest log line that fits over RTT (max 256); longer lines are cut
CONFIG_LOG_BACKEND_RTT_MESSAGE_SIZE=256

# %f in LOG_* / printk (sensor values in bar, mm, C)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use the Cortex-M4F hardware FPU for the sensor maths
CONFIG_FPU=y

# Sensor values log period (ms), like the CubeIDE 100 ms printf. 0 = off (acq7 still updated)
CONFIG_AQT7_DEBUG_PRINT_MS=100

# Shell on the console UART (USART1, the ST-LINK VCP), 115200 8N1.
# Log messages go through the shell, so the prompt is redrawn around them;
# "log halt" / "log go" silence and resume the 100 ms sensor log while typing.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Room for the float-formatting log calls that run in the shell thread
CONFIG_SHELL_STACK_SIZE=3072
# gpio get/set/conf, can send/show/filter (frames go onto the real bus), kernel threads/stacks
CONFIG_GPIO_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
