# GPIO: heartbeat (PC11) and brake light (PC10)
CONFIG_GPIO=y

# ADC1 (brake pressure, suspension, NTC) and CAN1/CAN2 drivers
CONFIG_ADC=y
CONFIG_CAN=y
# Error counters per type (stuff, form, ACK, bit, CRC) for can_bus_service()
CONFIG_STATS=y
CONFIG_CAN_STATS=y

# IWDG (watchdog0)
CONFIG_WATCHDOG=y
# sys_reboot(), used if a module fails to start and the IWDG isn't running
CONFIG_REBOOT=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# SEGGER RTT: a RAM buffer the ST-LINK reads/writes over SWD, so the shell and the log
# work with only the ST-LINK plugged in (west rtt -d build --runner openocd).
CONFIG_USE_SEGGER_RTT=y
# 4 KB up-buffer: ~2 s of the sensor log, so OpenOCD's polling never loses lines
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096
# Input buffer for shell commands (default 16 bytes cuts longer commands sent in one go)
CONFIG_SEGGER_RTT_BUFFER_SIZE_DOWN=128
# The log reaches RTT through the shell (below), which shares RTT channel 0 with it.
# A separate RTT log backend on the same channel would interleave with the shell, so it's off.
CONFIG_LOG_BACKEND_RTT=n

# %f in LOG_* / printk (sensor values in bar, mm, C)
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use the Cortex-M4F hardware FPU for the sensor maths
CONFIG_FPU=y

# Sensor values log period (ms), like the CubeIDE 100 ms printf. 0 = off (acq7 still updated)
CONFIG_AQT7_DEBUG_PRINT_MS=1000

# Shell on two transports, each with its own prompt and its own copy of the log:
#  - RTT over SWD (prompt "rtt:~$ "): needs only the ST-LINK. When nothing reads RTT (on
#    the car) the backend notices and drops output instead of waiting.
#  - USART1, 115200 8N1 (prompt "uart:~$ "): needs PA9/PA10 wired to the ST-LINK VCP or a
#    USB-UART adapter.
# Log messages go through the shell, so the prompt is redrawn around them;
# "log halt" / "log go" silence and resume the sensor log while typing.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=y
# Room for the float-formatting log calls that run in the shell thread
CONFIG_SHELL_STACK_SIZE=3072
# gpio get/set/conf, can send/show/filter (frames go onto the real bus), kernel threads/stacks
CONFIG_GPIO_SHELL=y
CONFIG_CAN_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y
