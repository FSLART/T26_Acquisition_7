# OpenOCD configuration for the AQT7 (STM32F412RE) through an ST-LINK V2/V3 on SWD.
# Used by the openocd runner: west rtt / west debug --runner openocd.

source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

set WORKAREASIZE 0x8000
source [find target/stm32f4x.cfg]

# NRST may not be wired to the debug connector: reset through the core (SYSRESETREQ)
reset_config none
